<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A73E8"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEA00"/>
      <stop offset="1" stop-color="#FFAB00"/>
    </linearGradient>
  </defs>
  <!-- Rounded shield -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="white" opacity="0.06"/>
  <!-- White envelope -->
  <g transform="translate(128,132)">
    <rect x="-72" y="-48" width="144" height="96" rx="14" fill="white"/>
    <path d="M -72 -34 L 0 18 L 72 -34" fill="none" stroke="#1A73E8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Lightning bolt (ultra fast) centered -->
  <path d="M 138 52 L 96 142 L 124 142 L 112 202 L 162 112 L 132 112 Z" fill="url(#bolt)" stroke="#7A3B00" stroke-width="4" stroke-linejoin="round"/>
  <!-- Small shield check / block badge -->
  <circle cx="188" cy="188" r="34" fill="white"/>
  <circle cx="188" cy="188" r="27" fill="#EA4335"/>
  <rect x="172" y="184" width="32" height="8" rx="4" fill="white" transform="rotate(-18 188 188)"/>
</svg>
